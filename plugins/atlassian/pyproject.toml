[project]
name = "atlassian"
version = "0.1.2"
requires-python = ">=3.13"
dependencies = [
    "marklas>=0.8.0",
    "mcp>=1.26.0",
    "httpx>=0.28.1",
    "pydantic>=2.12.5",
    "pydantic-settings>=2.13.1",
]

[tool.uv]
package = true

[build-system]
requires = ["hatchling>=1.29.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/atlassian"]
